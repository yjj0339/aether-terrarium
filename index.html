<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="color-scheme" content="dark">
<meta name="description" content="浮光方界 Aetherium：悬浮在深空玻璃立方体里的 3D 微缩生态世界，雪山、瀑布、森林、湖泊与昼夜流转，支持手机触控。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aetherium">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b12'/%3E%3Cpath d='M32 9 55 22v21L32 56 9 43V22z' fill='none' stroke='%238fdcc4' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M9 22l23 13 23-13M32 35v21' fill='none' stroke='%236aa6d6' stroke-width='1.5' opacity='.85'/%3E%3C/svg%3E">
<title>浮光方界 · Aetherium</title>
<style>
  :root {
    --ink: #252a27;
    --ink-soft: rgba(37, 42, 39, 0.56);
    --cream: #f4f1e9;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --serif: "Didot", "Bodoni MT", "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05070b; }
  html { overscroll-behavior: none; }
  body {
    position: fixed;
    inset: 0;
    height: var(--app-height, 100dvh);
    font-family: var(--sans);
    color: #f2f1ec;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    -webkit-touch-callout: none;
    user-select: none;
    overscroll-behavior: none;
  }
  #stage { position: fixed; top: 0; left: 0; width: 100%; height: var(--app-height, 100dvh); }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #stage canvas { cursor: grab; touch-action: none; -webkit-user-select: none; }
  #stage canvas.dragging { cursor: grabbing; }
  #stage::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(130% 92% at 50% 46%, transparent 40%, rgba(2, 4, 8, 0.24) 76%, rgba(1, 2, 5, 0.68) 110%),
      linear-gradient(180deg, rgba(2, 4, 8, 0.26) 0%, transparent 23%, transparent 70%, rgba(2, 4, 8, 0.44) 100%);
    z-index: 2;
  }

  .ui {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--app-height, 100dvh);
    z-index: 5;
    pointer-events: none;
  }

  .masthead {
    position: absolute;
    top: calc(var(--safe-top) + clamp(26px, 4.2vh, 52px));
    left: calc(var(--safe-left) + clamp(26px, 4.2vw, 64px));
    opacity: 0;
    transform: translateY(14px);
    animation: reveal 1.5s cubic-bezier(0.2, 0.7, 0.2, 1) 1.15s forwards;
  }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: 0.27em;
    text-transform: uppercase;
    color: rgba(236, 237, 230, 0.5);
  }
  .eyebrow::before {
    content: "";
    width: 26px;
    height: 1px;
    background: linear-gradient(90deg, rgba(244, 224, 183, 0.85), rgba(244, 224, 183, 0.08));
  }
  .title {
    margin: 18px 0 0;
    font-family: var(--serif);
    font-size: clamp(46px, 6.4vw, 94px);
    font-weight: 400;
    letter-spacing: 0.055em;
    line-height: 0.88;
    color: #f5f2e9;
    text-shadow: 0 10px 48px rgba(0, 0, 0, 0.5);
  }
  .title span {
    display: block;
    margin-top: 15px;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.46em;
    color: rgba(242, 238, 226, 0.46);
  }
  .intro {
    max-width: 290px;
    margin: 22px 0 0 2px;
    font-family: var(--serif);
    font-size: 13px;
    font-style: italic;
    line-height: 1.7;
    letter-spacing: 0.015em;
    color: rgba(239, 237, 229, 0.62);
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.42);
  }

  .phase {
    position: absolute;
    top: calc(var(--safe-top) + clamp(28px, 4.3vh, 54px));
    right: calc(var(--safe-right) + clamp(26px, 4.2vw, 64px));
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 11px 15px 11px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(14, 17, 19, 0.26);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.16);
    backdrop-filter: blur(18px) saturate(120%);
    -webkit-backdrop-filter: blur(18px) saturate(120%);
    opacity: 0;
    animation: reveal 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) 1.45s forwards;
  }
  .phase-orb {
    position: relative;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid rgba(251, 233, 196, 0.38);
    overflow: hidden;
  }
  .phase-orb::before {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #fff6d9, #ecc67e 46%, #a8783f 100%);
    box-shadow: 0 0 14px rgba(240, 198, 122, 0.55);
    transition: transform 1s ease, background 1s ease;
  }
  .phase[data-mode="night"] .phase-orb::before {
    transform: translateX(-8px);
    background: radial-gradient(circle at 62% 32%, #dfe7ff, #8fa0d8 52%, #586492 100%);
    box-shadow: 0 0 14px rgba(141, 163, 224, 0.5);
  }
  .phase-copy { display: grid; gap: 3px; }
  .phase-en {
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(244, 240, 228, 0.43);
  }
  .phase-name {
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.13em;
    color: rgba(248, 244, 233, 0.9);
  }

  .hint {
    position: absolute;
    left: calc(var(--safe-left) + clamp(26px, 4.2vw, 64px));
    bottom: calc(var(--safe-bottom) + 38px);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 9px;
    letter-spacing: 0.13em;
    color: rgba(240, 238, 230, 0.35);
    opacity: 0;
    animation: reveal 1.4s ease 2s forwards;
  }
  .hint i {
    width: 17px;
    height: 17px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-style: normal;
    font-size: 7px;
    color: rgba(255, 255, 255, 0.4);
  }

  .touch-hint {
    position: absolute;
    left: 50%;
    bottom: calc(var(--safe-bottom) + 108px);
    z-index: 2;
    display: none;
    align-items: center;
    gap: 9px;
    padding: 9px 14px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    background: rgba(10, 14, 17, 0.46);
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.28);
    backdrop-filter: blur(18px) saturate(130%);
    -webkit-backdrop-filter: blur(18px) saturate(130%);
    color: rgba(246, 242, 231, 0.72);
    font-size: 10px;
    letter-spacing: 0.09em;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translateX(-50%) translateY(6px);
    animation: touch-hint-in 1s ease 2.1s forwards;
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .touch-hint.hide { opacity: 0; transform: translateX(-50%) translateY(6px); animation: none; }
  .touch-pulse {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ead6a9;
    box-shadow: 0 0 12px rgba(234, 214, 169, 0.68);
    animation: touch-pulse 2.2s ease-in-out infinite;
  }
  .touch-device .touch-hint { display: flex; }

  .dock {
    position: absolute;
    left: 50%;
    bottom: calc(var(--safe-bottom) + clamp(20px, 3.4vh, 38px));
    transform: translateX(-50%) translateY(18px);
    display: flex;
    align-items: center;
    gap: 15px;
    width: min(510px, calc(100vw - 40px));
    padding: 11px 14px 11px 12px;
    border-radius: 23px;
    color: var(--ink);
    border: 1px solid rgba(255, 255, 255, 0.6);
    background: linear-gradient(145deg, rgba(250, 248, 243, 0.84), rgba(236, 233, 225, 0.7));
    box-shadow:
      0 22px 60px rgba(0, 0, 0, 0.3),
      0 4px 12px rgba(0, 0, 0, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.68);
    backdrop-filter: blur(28px) saturate(145%);
    -webkit-backdrop-filter: blur(28px) saturate(145%);
    pointer-events: auto;
    opacity: 0;
    animation: dock-in 1.6s cubic-bezier(0.18, 0.76, 0.22, 1) 1.6s forwards;
  }
  .transport {
    flex: 0 0 auto;
    width: 37px;
    height: 37px;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #262a27;
    color: #f6f3eb;
    box-shadow: 0 5px 12px rgba(16, 19, 17, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    cursor: pointer;
    transition: transform 0.22s ease, background 0.22s ease;
  }
  .transport:hover { transform: scale(1.04); background: #343935; }
  .transport:active { transform: scale(0.96); }
  .transport svg { width: 14px; height: 14px; display: block; }
  .transport .icon-play { display: none; margin-left: 2px; }
  .dock.paused .icon-pause { display: none; }
  .dock.paused .icon-play { display: block; }
  .timeline { flex: 1 1 auto; min-width: 0; display: grid; gap: 7px; padding-top: 1px; }
  .timeline-labels {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 2px;
  }
  .timeline-labels span {
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .timeline-labels .clock {
    font-size: 10px;
    letter-spacing: 0.11em;
    font-variant-numeric: tabular-nums;
    color: rgba(37, 42, 39, 0.78);
  }
  .time-range {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    height: 16px;
    margin: 0;
    background: transparent;
    cursor: pointer;
  }
  .time-range::-webkit-slider-runnable-track {
    height: 3px;
    border-radius: 99px;
    background: linear-gradient(90deg, #c1b6a1 0%, #e5c888 19%, #f3dfb8 34%, #d7a37f 52%, #8a7f8e 68%, #4e5b75 85%, #31394f 100%);
    box-shadow: inset 0 0.5px 0 rgba(0, 0, 0, 0.18);
  }
  .time-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    margin-top: -4.5px;
    border-radius: 50%;
    background: #fbf8f0;
    border: 1px solid rgba(45, 50, 46, 0.18);
    box-shadow: 0 1px 4px rgba(22, 25, 22, 0.3), 0 0 0 3px rgba(255, 255, 255, 0.18);
  }
  .time-range::-moz-range-track {
    height: 3px;
    border-radius: 99px;
    background: linear-gradient(90deg, #c1b6a1 0%, #e5c888 19%, #f3dfb8 34%, #d7a37f 52%, #8a7f8e 68%, #4e5b75 85%, #31394f 100%);
  }
  .time-range::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fbf8f0;
    border: 1px solid rgba(45, 50, 46, 0.18);
  }
  .dock-line {
    flex: 0 0 auto;
    width: 1px;
    height: 22px;
    background: rgba(37, 42, 39, 0.13);
  }
  .reset {
    flex: 0 0 auto;
    width: 29px;
    height: 29px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: rgba(37, 42, 39, 0.53);
    cursor: pointer;
    transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }
  .reset:hover { color: rgba(37, 42, 39, 0.88); background: rgba(33, 38, 34, 0.07); transform: rotate(-18deg); }
  .reset svg { width: 14px; height: 14px; }

  .immerse {
    flex: 0 0 auto;
    width: 29px;
    height: 29px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: rgba(37, 42, 39, 0.53);
    cursor: pointer;
    transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }
  .immerse:hover { color: rgba(37, 42, 39, 0.88); background: rgba(33, 38, 34, 0.07); transform: scale(1.04); }
  .immerse svg { width: 14px; height: 14px; }
  .immerse .icon-collapse { display: none; }
  body.immersive .immerse .icon-expand { display: none; }
  body.immersive .immerse .icon-collapse { display: block; }
  body.immersive .masthead,
  body.immersive .phase,
  body.immersive .hint,
  body.immersive .corner-mark,
  body.immersive .touch-hint {
    opacity: 0 !important;
    visibility: hidden;
    pointer-events: none;
  }
  body.immersive .masthead { transform: translateY(-10px); }
  .masthead, .phase, .corner-mark, .hint { transition: opacity 0.55s ease, transform 0.55s ease; }

  .corner-mark {
    position: absolute;
    right: calc(var(--safe-right) + clamp(26px, 4.2vw, 64px));
    bottom: calc(var(--safe-bottom) + 38px);
    display: grid;
    justify-items: end;
    gap: 5px;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(238, 236, 226, 0.25);
    opacity: 0;
    animation: reveal 1.4s ease 2.15s forwards;
  }
  .corner-mark b {
    font-weight: 400;
    color: rgba(238, 236, 226, 0.4);
    letter-spacing: 0.12em;
    font-variant-numeric: tabular-nums;
  }

  #loader {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    background:
      radial-gradient(80% 65% at 50% 48%, rgba(16, 24, 30, 0.78), rgba(4, 6, 9, 0.99) 72%),
      #04060a;
    transition: opacity 1.35s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.35s;
  }
  #loader.done { opacity: 0; visibility: hidden; }
  .loader-inner { display: grid; justify-items: center; gap: 18px; transform: translateY(-3vh); }
  .loader-ring {
    position: relative;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(237, 226, 201, 0.12);
  }
  .loader-ring::before, .loader-ring::after {
    content: "";
    position: absolute;
    border-radius: 50%;
  }
  .loader-ring::before {
    inset: 7px;
    border: 1px solid transparent;
    border-top-color: rgba(236, 213, 165, 0.75);
    border-right-color: rgba(172, 201, 192, 0.18);
    animation: spin 1.7s linear infinite;
  }
  .loader-ring::after {
    inset: 20px;
    background: radial-gradient(circle at 36% 30%, #fff4d3, #d9b878 55%, #88653b);
    box-shadow: 0 0 18px rgba(231, 196, 128, 0.4);
    animation: breathe 2.8s ease-in-out infinite;
  }
  .loader-copy { text-align: center; display: grid; gap: 8px; }
  .loader-label {
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: rgba(233, 231, 222, 0.34);
  }
  .loader-title {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 0.14em;
    color: rgba(245, 241, 231, 0.8);
  }
  .loader-status {
    min-height: 13px;
    font-size: 9px;
    letter-spacing: 0.13em;
    color: rgba(235, 233, 224, 0.3);
    font-variant-numeric: tabular-nums;
  }

  .fallback {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: none;
    place-items: center;
    background: #06080c;
    color: rgba(244, 242, 234, 0.8);
    text-align: center;
    padding: 30px;
  }
  .fallback.show { display: grid; }
  .fallback p { font-size: 13px; line-height: 1.8; letter-spacing: 0.04em; max-width: 360px; }

  @keyframes reveal { to { opacity: 1; transform: translateY(0); } }
  @keyframes dock-in { to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(0.88); opacity: 0.72; } 50% { transform: scale(1.1); opacity: 1; } }
  @keyframes touch-hint-in { to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  @keyframes touch-pulse { 0%, 100% { transform: scale(0.75); opacity: 0.45; } 50% { transform: scale(1.15); opacity: 1; } }

  @media (max-width: 760px) {
    .masthead { top: calc(var(--safe-top) + 46px); left: calc(var(--safe-left) + 18px); }
    .eyebrow { gap: 8px; font-size: 7.5px; letter-spacing: 0.18em; }
    .eyebrow::before { width: 18px; }
    .title { font-size: clamp(34px, 10.4vw, 44px); margin-top: 10px; line-height: 0.9; }
    .title span { font-size: 7.5px; letter-spacing: 0.33em; margin-top: 10px; }
    .intro { display: none; }
    .phase { top: calc(var(--safe-top) + 10px); right: calc(var(--safe-right) + 14px); padding: 8px 12px 8px 9px; gap: 8px; }
    .phase-orb { width: 18px; height: 18px; }
    .phase-en { display: none; }
    .phase-name { font-size: 10.5px; }
    .hint, .corner-mark { display: none; }
    .dock {
      bottom: calc(var(--safe-bottom) + 12px);
      width: calc(100vw - 24px);
      max-width: 500px;
      gap: 8px;
      padding: 8px 10px 8px 8px;
      border-radius: 22px;
    }
    .transport { width: 44px; height: 44px; }
    .transport svg { width: 16px; height: 16px; }
    .timeline { gap: 5px; }
    .timeline-labels { justify-content: flex-end; }
    .timeline-labels span:first-child, .timeline-labels span:last-child { display: none; }
    .timeline-labels .clock { font-size: 10px; }
    .time-range { height: 26px; }
    .time-range::-webkit-slider-thumb { width: 16px; height: 16px; margin-top: -6.5px; }
    .time-range::-moz-range-thumb { width: 16px; height: 16px; }
    .dock-line { display: none; }
    .reset, .immerse { width: 44px; height: 44px; }
    .reset svg, .immerse svg { width: 17px; height: 17px; }
    .touch-hint { bottom: calc(var(--safe-bottom) + 88px); padding: 8px 12px; font-size: 9.5px; letter-spacing: 0.06em; }
  }

  @media (orientation: landscape) and (max-height: 540px) {
    .masthead, .hint, .corner-mark { display: none; }
    .phase { top: calc(var(--safe-top) + 8px); right: calc(var(--safe-right) + 12px); padding: 6px 10px 6px 8px; }
    .phase-orb { width: 16px; height: 16px; }
    .phase-name { font-size: 10px; }
    .dock { bottom: calc(var(--safe-bottom) + 8px); width: min(560px, calc(100vw - 24px)); padding: 7px 10px; gap: 8px; }
    .transport { width: 44px; height: 44px; }
    .reset, .immerse { width: 44px; height: 44px; }
    .time-range { height: 22px; }
    .touch-hint, .touch-device .touch-hint { display: none; }
  }

  @media (hover: none) and (pointer: coarse) and (min-width: 761px) {
    .transport, .reset, .immerse { width: 44px; height: 44px; }
    .transport svg, .reset svg, .immerse svg { width: 16px; height: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001s !important; animation-delay: 0s !important; }
  }
</style>
</head>
<body>
<div id="stage"></div>

<div class="ui">
  <header class="masthead">
    <div class="eyebrow">Specimen No. 07 <span>·</span> Celestial Biome</div>
    <h1 class="title">Aetherium<span>浮 光 方 界</span></h1>
    <p class="intro">一方被星光收藏的微缩世界，<br>山雪、林息与水声，在玻璃里静静呼吸。</p>
  </header>

  <div class="phase" id="phaseChip" data-mode="day">
    <span class="phase-orb"></span>
    <span class="phase-copy">
      <span class="phase-en" id="phaseEn">Golden Hour</span>
      <span class="phase-name" id="phaseName">薄暮 · 18:42</span>
    </span>
  </div>

  <div class="hint"><i>↔</i> 拖拽环视 · 滚轮靠近</div>
  <div class="touch-hint" id="touchHint"><span class="touch-pulse"></span><span>单指环视 · 双指缩放 · 双击复位</span></div>
